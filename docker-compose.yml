services:
  postgres:
    image: postgres:16-alpine
    container_name: doodle-postgres
    environment:
      POSTGRES_DB: doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doodle -d doodle"]
      interval: 5s
      timeout: 5s
      retries: 5

  doodle-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doodle-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/doodle
      DB_USER: doodle
      DB_PASSWORD: doodle
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
