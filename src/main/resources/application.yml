spring:
  application:
    name: mini-doodle-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doodle}
    username: ${DB_USER:doodle}
    password: ${DB_PASSWORD:doodle}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.example.doodle: DEBUG
